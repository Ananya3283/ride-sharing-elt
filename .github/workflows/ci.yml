name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Lint and unit tests (PySpark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v

  dbt:
    name: dbt build on fixture data
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: elt
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elt -d warehouse"
          --health-interval 5s --health-retries 10
    env:
      POSTGRES_USER: elt
      POSTGRES_PASSWORD: ci_pw
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      S3_ACCESS_KEY: unused
      S3_SECRET_KEY: unused
      DBT_FLAGS: --project-dir dbt/ride_sharing --profiles-dir dbt/ride_sharing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install psycopg2-binary==2.9.13 "dbt-core==1.12.6" "dbt-postgres==1.11.0"
      - run: python -m scripts.load_fixtures
      - name: dbt build (full)
        run: dbt build $DBT_FLAGS
      - name: dbt build (incremental re-run)
        run: dbt build $DBT_FLAGS
